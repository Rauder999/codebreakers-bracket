<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codebreakers - Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Terminal Violet tokens ───
       violet = brand · green = advance · orange = drop to LB
       red = LIVE · gold = champion · dimmed = eliminated */
    :root {
      --cb-bg:      #08090c;
      --cb-panel:   #0d0f14;
      --cb-panel2:  #12151d;
      --cb-border:  #1e222d;
      --cb-border2: #2b3142;
      --cb-text:    #e6e9f2;
      --cb-muted:   #7f8698;
      --cb-silver:  #aab1c5;
      --cb-purple:  #7c5cff;
      --cb-purple2: #a48fff;
      --cb-green:   #28d17c;
      --cb-red:     #ff4d5e;
      --cb-orange:  #ff8a3d;
      --cb-gold:    #e8b64a;
      --cb-cyan:    #38e1e8;
      --fd: 'Space Grotesk', sans-serif;
      --ft: 'Inter', sans-serif;
      --fm: 'IBM Plex Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cb-bg);
      color: var(--cb-text);
      font-family: var(--ft);
      font-size: 14px;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    ::selection { background: rgba(124,92,255,0.35); }
    /* ─── Header ─── */
    .cb-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 16px 18px;
      border-bottom: 1px solid var(--cb-border);
      position: relative;
    }
    .cb-header::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 160px;
      background: radial-gradient(ellipse at center, rgba(124,92,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .cb-title {
      font-family: var(--fd);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--cb-text);
    }
    .cb-subtitle {
      font-family: var(--fm);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--cb-purple2);
      margin-top: 5px;
    }
    .cb-tournament-name {
      font-family: var(--fd);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cb-gold);
      margin-top: 8px;
    }
    .live-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255,77,94,0.08);
      border: 1px solid rgba(255,77,94,0.55);
      color: var(--cb-red);
      font-family: var(--fm);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      padding: 3px 12px;
      margin-top: 10px;
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cb-red);
      animation: livePulse 1.6s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--cb-red); }
      50%       { opacity: 0.3; box-shadow: none; }
    }
    .live-badge.archived {
      background: rgba(232,182,74,0.08);
      border-color: rgba(232,182,74,0.55);
      color: var(--cb-gold);
    }
    .live-badge.archived .live-dot { display: none; }
    .gallery-card-champion {
      font-family: var(--fm);
      font-size: 11px;
      color: var(--cb-gold);
      margin-top: 6px;
      letter-spacing: 0.06em;
    }
    /* ─── Status bar ─── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-bottom: 1px solid var(--cb-border);
      font-family: var(--fm);
      font-size: 10.5px;
      color: var(--cb-muted);
      letter-spacing: 0.05em;
    }
    .back-btn, .refresh-btn {
      background: var(--cb-panel);
      border: 1px solid var(--cb-border2);
      color: var(--cb-silver);
      font-family: var(--fd);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 150ms, color 150ms;
    }
    .back-btn:hover, .refresh-btn:hover { border-color: var(--cb-purple); color: var(--cb-text); }

    /* ─── Gallery ─── */
    #gallery-view { display: none; }
    .gallery-header {
      padding: 24px 20px 12px;
      font-family: var(--fd);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cb-purple2);
      border-bottom: 1px solid var(--cb-border);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .gallery-card {
      background: var(--cb-panel);
      border: 1px solid var(--cb-border);
      padding: 18px 20px;
      cursor: pointer;
      transition: border-color 150ms, background 150ms, transform 150ms, box-shadow 150ms;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .gallery-card:hover {
      border-color: var(--cb-purple);
      background: rgba(124,92,255,0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .gallery-card-name {
      font-family: var(--fd);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cb-text);
    }
    .gallery-card-meta {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--cb-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .gallery-card-updated {
      font-family: var(--fm);
      font-size: 10.5px;
      color: var(--cb-cyan);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    .gallery-card-host {
      font-size: 11px;
      color: var(--cb-silver);
      letter-spacing: 0.03em;
    }
    .gallery-card-arrow {
      align-self: flex-end;
      font-size: 18px;
      color: var(--cb-purple2);
      margin-top: 4px;
      transition: transform 150ms;
    }
    .gallery-card:hover .gallery-card-arrow { transform: translateX(4px); }
    .gallery-empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--cb-muted);
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    /* Manual code entry */
    .gallery-fallback {
      padding: 20px;
      border-top: 1px solid var(--cb-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .gallery-fallback-label {
      font-size: 11.5px;
      color: var(--cb-muted);
      letter-spacing: 0.03em;
    }
    .code-input {
      background: var(--cb-panel);
      border: 1px solid var(--cb-border2);
      color: var(--cb-cyan);
      font-family: var(--fm);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      padding: 6px 12px;
      text-transform: uppercase;
      width: 130px;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .code-input:focus { border-color: var(--cb-purple); box-shadow: 0 0 0 3px rgba(124,92,255,0.14); }
    .code-input::placeholder { color: var(--cb-muted); }
    .code-go-btn {
      background: var(--cb-purple);
      border: none;
      color: #0b0716;
      font-family: var(--fd);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 150ms, box-shadow 150ms;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    .code-go-btn:hover { background: var(--cb-purple2); box-shadow: 0 0 20px rgba(124,92,255,0.35); }

    /* ─── Bracket view ─── */
    #bracket-view { display: none; }
    .waiting-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: 16px;
      color: var(--cb-muted);
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .waiting-pulse {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--cb-purple);
      animation: livePulse 1.6s ease-in-out infinite;
    }
    .bracket-container {
      overflow-x: auto;
      padding: 20px 16px 40px;
      position: relative;
    }
    .bracket-inner {
      display: inline-flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 0;
      min-width: max-content;
    }
    .de-bracket-wrapper {
      display: grid;
      /* GF column hugs content so the Grand Final sits right after the brackets */
      grid-template-columns: max-content max-content;
      grid-template-rows: auto auto auto;
      gap: 0;
      min-width: max-content;
    }
    .de-row { display: flex; flex-direction: column; padding: 12px 0; }
    .de-row-label {
      font-family: var(--fm); font-weight: 500; font-size: 10px; letter-spacing: 0.3em;
      text-transform: uppercase; padding: 0 16px 8px;
      border-bottom: 1px solid rgba(124,92,255,0.2); margin-bottom: 8px;
    }
    .wb-row-label { color: var(--cb-purple2); }
    .lb-row-label { color: var(--cb-orange); border-bottom-color: rgba(255,138,61,0.2); }
    .de-row-phases { display: flex; flex-direction: row; align-items: center; padding: 12px 0; }
    .de-zone-divider { grid-column: 1 / 3; height: 1px; background: linear-gradient(to right, rgba(124,92,255,0.25), rgba(255,138,61,0.25)); margin: 0; }
    .de-gf-column {
      grid-column: 2; grid-row: 1 / 4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px 16px 16px 8px;
      border-left: 1px solid rgba(232,182,74,0.2);
      min-width: 200px;
    }
    .bracket-phase { display: flex; flex-direction: column; align-items: center; padding: 0 8px; }
    .phase-label {
      font-family: var(--fm); font-weight: 500; font-size: 9.5px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--cb-muted);
      padding-bottom: 8px; text-align: center;
    }
    .lb-phase-label { color: var(--cb-orange); }
    .gf-phase-label { color: var(--cb-gold); }
    .pods-column { display: flex; flex-direction: column; gap: 8px; }
    .connector-spacer { width: 20px; flex-shrink: 0; }
    /* ─── Pods ─── */
    .match-pod {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.028), transparent 46%),
        var(--cb-panel);
      border: 1px solid var(--cb-border);
      min-width: 184px; max-width: 244px;
      display: flex; flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.045), 0 4px 16px rgba(0,0,0,0.55);
    }
    .gf-pod { border-color: rgba(232,182,74,0.55); min-width: 200px; box-shadow: inset 0 1px 0 rgba(232,182,74,0.12), 0 0 22px rgba(232,182,74,0.12), 0 4px 16px rgba(0,0,0,0.55); }
    .lb-pod { border-color: var(--cb-border); }
    .pod-header {
      font-family: var(--fm); font-weight: 500; font-size: 9px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--cb-silver);
      padding: 6px 12px; border-bottom: 1px solid var(--cb-border);
      background: linear-gradient(180deg, #171b26, var(--cb-panel2));
      display: flex; align-items: center; gap: 6px;
    }
    .gf-header { color: var(--cb-gold); border-bottom-color: rgba(232,182,74,0.3); background: rgba(232,182,74,0.05); }
    .lb-header { color: var(--cb-orange); background: linear-gradient(180deg, #171b26, var(--cb-panel2)); box-shadow: inset 2px 0 0 var(--cb-orange); }
    /* Map plate */
    .map-plate {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-bottom: 1px solid var(--cb-border);
      background: rgba(124,92,255,0.045);
    }
    .map-plate::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--cb-purple); opacity: 0.7; flex-shrink: 0; }
    .map-name { font-family: var(--fm); font-size: 9px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cb-purple2); }
    /* ─── Team rows — semantic states ───
       LIVE (red pod glow) / ADVANCE (green) / DROP->LB (orange)
       ELIMINATED (dim + strikethrough) / CHAMPION (gold)          */
    .team-row {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.045);
      border-left: 3px solid transparent;
      font-size: 13px; transition: background 120ms;
    }
    .team-row:last-child { border-bottom: none; }
    .team-row.champion { background: linear-gradient(90deg, rgba(232,182,74,0.12), rgba(232,182,74,0.03) 55%, transparent); border-left-color: var(--cb-gold); }
    .team-row.advancing { background: linear-gradient(90deg, rgba(40,209,124,0.10), rgba(40,209,124,0.03) 55%, transparent); border-left-color: var(--cb-green); }
    .team-row.dropping { background: linear-gradient(90deg, rgba(255,138,61,0.09), rgba(255,138,61,0.03) 55%, transparent); border-left-color: var(--cb-orange); }
    .team-row.eliminated { opacity: 0.38; }
    .team-row.eliminated .team-name { text-decoration: line-through; text-decoration-color: var(--cb-muted); text-decoration-thickness: 1px; }
    .team-seed-group { display: flex; align-items: center; gap: 3px; min-width: 30px; }
    .team-seed { font-family: var(--fm); font-size: 9.5px; color: var(--cb-muted); opacity: 0.75; letter-spacing: 0.02em; }
    .team-emoji { font-size: 12px; min-width: 16px; text-align: center; color: var(--cb-gold); }
    .team-name {
      flex: 1; font-family: var(--fd); font-weight: 600; font-size: 13px; letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      position: relative;
    }
    .team-row.champion .team-name { color: var(--cb-gold); font-weight: 700; }
    .team-row.advancing .team-name { color: #f4f7ff; font-weight: 700; }
    .team-row.dropping .team-name { color: var(--cb-orange); }
    .team-name.empty { color: var(--cb-muted); font-style: italic; font-weight: 400; font-family: var(--ft); }
    .team-name.has-roster {
      border-bottom: 1px dashed rgba(164,143,255,0.45);
      cursor: default;
      overflow: visible;
    }
    .roster-tooltip {
      display: none;
      position: absolute;
      left: 0; top: calc(100% + 4px);
      background: var(--cb-panel2);
      border: 1px solid rgba(124,92,255,0.6);
      padding: 8px 12px;
      z-index: 1000;
      min-width: 160px;
      max-width: 260px;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .team-name.has-roster:hover .roster-tooltip { display: flex; }
    .roster-tooltip-title { font-family: var(--fm); font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: var(--cb-purple2); text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid rgba(124,92,255,0.3); padding-bottom: 4px; }
    .roster-tooltip-player { font-family: var(--ft); font-size: 12px; color: var(--cb-text); letter-spacing: 0.02em; font-weight: 500; }
    .placement-badge {
      font-family: var(--fm); font-size: 9px; color: var(--cb-muted);
      letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0;
      padding: 2px 6px; border: 1px solid var(--cb-border2); background: rgba(255,255,255,0.02);
    }
    .team-row.advancing .placement-badge { color: var(--cb-green); border-color: rgba(40,209,124,0.4); background: rgba(40,209,124,0.08); }
    .team-row.dropping .placement-badge { color: var(--cb-orange); border-color: rgba(255,138,61,0.4); background: rgba(255,138,61,0.08); }
    .team-row.eliminated .placement-badge { border-color: var(--cb-border); }
    .champion-badge { color: var(--cb-gold) !important; border-color: rgba(232,182,74,0.4) !important; background: rgba(232,182,74,0.08) !important; }
    .path-badge { font-family: var(--fm); font-size: 8.5px; font-weight: 500; letter-spacing: 0.1em; flex-shrink: 0; padding: 1px 4px; border: 1px solid; }
    .wb-badge { background: rgba(124,92,255,0.08); border-color: rgba(124,92,255,0.4); color: var(--cb-purple2); }
    .lb-badge { background: rgba(255,138,61,0.08); border-color: rgba(255,138,61,0.4); color: var(--cb-orange); }
    /* ─── Streaming treatment ─── */
    .match-pod.on-stream {
      box-shadow: 0 0 0 1px rgba(56,225,232,0.45);
    }
    .match-pod.on-stream .pod-header {
      background: rgba(56,225,232,0.07);
      color: var(--cb-cyan);
    }
    .match-pod.live-now {
      border-color: rgba(255,77,94,0.6);
      box-shadow: 0 0 0 1px rgba(255,77,94,0.3), 0 0 22px rgba(255,77,94,0.12);
      animation: livePodPulse 2.4s ease-in-out infinite;
    }
    .match-pod.live-now .pod-header {
      background: rgba(255,77,94,0.10);
      color: var(--cb-red);
    }
    @keyframes livePodPulse {
      50% { box-shadow: 0 0 0 1px rgba(255,77,94,0.5), 0 0 30px rgba(255,77,94,0.22); }
    }
    .stream-live-badge {
      font-family: var(--fm); font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--cb-red);
    }
    /* ─── Compact mode ─── */
    body.compact .team-row { padding: 3px 10px; min-height: 0; font-size: 11px; }
    body.compact .team-name { font-size: 11px; }
    body.compact .team-emoji { font-size: 10px; }
    body.compact .pods-column { gap: 4px; }
    body.compact .pod-header { padding: 3px 10px; font-size: 8px; }
    body.compact .map-plate { padding: 2px 10px; }
    body.compact .match-pod { min-width: 160px; }
    /* Compact toggle button */
    .compact-btn {
      background: var(--cb-panel);
      border: 1px solid var(--cb-border2);
      color: var(--cb-silver);
      font-family: var(--fd);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 150ms, color 150ms;
    }
    .compact-btn:hover { border-color: var(--cb-purple); color: var(--cb-text); }
    .compact-btn.active { border-color: var(--cb-purple); color: var(--cb-purple2); background: rgba(124,92,255,0.08); }
    /* ─── Match chat (participants + admins only) ─── */
    .match-pod { position: relative; }
    .pod-chat-btn {
      position: absolute; top: 5px; right: 6px; z-index: 5;
      background: rgba(56,225,232,0.07); border: 1px solid var(--cb-border2);
      color: var(--cb-cyan); font-size: 11px; line-height: 1; cursor: pointer; padding: 3px 7px;
      transition: border-color 150ms;
    }
    .pod-chat-btn:hover { border-color: var(--cb-cyan); }
    .chat-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92vw;
      background: var(--cb-panel); border-left: 1px solid var(--cb-border2);
      z-index: 950; display: none; flex-direction: column; box-shadow: -6px 0 24px rgba(0,0,0,0.6);
    }
    .chat-drawer.open { display: flex; }
    .chat-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid var(--cb-border);
      font-family: var(--fm); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cb-cyan);
    }
    .chat-close { background: none; border: none; color: var(--cb-muted); cursor: pointer; font-size: 16px; line-height: 1; }
    .chat-close:hover { color: var(--cb-text); }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
    .chat-empty { color: var(--cb-muted); font-size: 12px; text-align: center; padding: 24px 8px; }
    .chat-msg { font-size: 12.5px; line-height: 1.45; position: relative; padding-right: 16px; }
    .chat-msg .m-head { display: flex; gap: 7px; align-items: baseline; }
    .chat-msg .m-name { font-weight: 600; color: var(--cb-purple2); font-size: 12px; }
    .chat-msg.admin .m-name { color: var(--cb-gold); }
    .chat-msg .m-time { font-family: var(--fm); font-size: 9.5px; color: var(--cb-muted); }
    .chat-msg .m-text { color: var(--cb-text); word-break: break-word; white-space: pre-wrap; }
    .chat-del { position: absolute; right: 0; top: 0; background: none; border: none; color: var(--cb-red); cursor: pointer; font-size: 12px; line-height: 1; display: none; opacity: 0.7; }
    .chat-del:hover { opacity: 1; }
    body.chat-admin .chat-del { display: block; }
    .chat-input-row { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--cb-border); }
    .chat-input {
      flex: 1; background: var(--cb-bg); border: 1px solid var(--cb-border2); color: var(--cb-text);
      font-size: 12.5px; padding: 7px 9px; outline: none; min-width: 0;
    }
    .chat-input:focus { border-color: var(--cb-purple); }
    .discord-btn {
      background: rgba(124,92,255,0.08); border: 1px solid rgba(124,92,255,0.5); color: var(--cb-purple2);
      font-family: var(--fm); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 12px; cursor: pointer; transition: border-color 150ms;
    }
    .discord-btn:hover { border-color: var(--cb-purple); }
    .chat-user-chip { font-family: var(--fm); font-size: 10.5px; color: var(--cb-cyan); letter-spacing: 0.06em; display: inline-flex; gap: 6px; align-items: center; }
    .chat-user-chip .chat-signout { background: none; border: none; color: var(--cb-muted); cursor: pointer; font-size: 10px; text-decoration: underline; }
    /* ─── Reduced motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .live-dot, .waiting-pulse, .match-pod.live-now { animation: none !important; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <div class="cb-header">
    <div class="cb-title">CODEBREAKERS</div>
    <div class="cb-subtitle" id="headerSubtitle">LIVE TOURNAMENTS</div>
    <div class="cb-tournament-name" id="tournamentNameEl" style="display:none"></div>
    <div class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE</div>
  </div>

  <!-- ─── Status bar (bracket view only) ─── -->
  <div class="status-bar" id="statusBar" style="display:none">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="back-btn" onclick="showGallery()">Back to Gallery</button>
      <span id="statusText" style="font-size:11px;color:var(--cb-muted)"></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="chatIdentity"></span>
      <button class="compact-btn" id="compactBtn" onclick="toggleCompact()">Compact</button>
      <button class="refresh-btn" onclick="currentArchive ? fetchArchive() : fetchSession()">Refresh</button>
    </div>
  </div>

  <!-- ─── Gallery view ─── -->
  <div id="gallery-view">
    <div class="gallery-header">Live Tournaments</div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-header" style="margin-top:36px">Past Tournaments</div>
    <div class="gallery-grid" id="archiveGrid"></div>
    <div class="gallery-fallback">
      <span class="gallery-fallback-label">Have a code? Enter it:</span>
      <input class="code-input" id="codeInput" placeholder="CB-XXXX" maxlength="7"
        onkeydown="if(event.key==='Enter') goToCode()" />
      <button class="code-go-btn" onclick="goToCode()">Go</button>
    </div>
  </div>

  <!-- ─── Bracket view ─── -->
  <div id="bracket-view">
    <div id="main"></div>
  </div>

  <!-- ─── Match chat drawer (participants + admins only) ─── -->
  <div class="chat-drawer" id="chatDrawer">
    <div class="chat-head">
      <span id="chatTitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">MATCH CHAT</span>
      <button class="chat-close" onclick="closeChat()">&#10005;</button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" maxlength="400" placeholder="Message..."
        onkeydown="if(event.key==='Enter') sendChat()" />
      <button class="code-go-btn" onclick="sendChat()">Send</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://codebreakers-api.codebreakerstf.workers.dev";
    const POLL_INTERVAL = 5000;
    const GALLERY_POLL = 15000;
    const PLACEMENT_LABELS = { 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", 6: "6th", 7: "7th", 8: "8th" };

    let currentSession = null;
    let currentArchive = null;
    let lastUpdated = null;
    // ─── Chat identity: admin token is shared with the admin app (same origin) ──
    let discordToken = localStorage.getItem("cb_discord_token") || null;
    const adminToken = localStorage.getItem("cb_auth_token") || null;
    let chatIsAdmin = false;
    let chatPodSet = new Set();
    let chatOpenPod = null;
    let pollTimer = null;
    let galleryTimer = null;
    let _compactActive = false;
    let ws = null;
    let wsReconnect = null;
    const WS_URL = WORKER_URL.replace(/^http/, "ws");

    // ─── Routing ─────────────────────────────────────────────────────────────
    function getSessionParam() {
      return new URLSearchParams(window.location.search).get("session");
    }
    function getArchiveParam() {
      return new URLSearchParams(window.location.search).get("archive");
    }

    // Capture the token Discord OAuth left in the URL hash, then clean the URL.
    function captureDiscordHash() {
      const h = window.location.hash || "";
      const m = h.match(/#discord=([^&]+)/);
      if (m) {
        discordToken = decodeURIComponent(m[1]);
        localStorage.setItem("cb_discord_token", discordToken);
        history.replaceState({}, "", window.location.pathname + window.location.search);
      } else if (h.indexOf("#discord_error") === 0) {
        history.replaceState({}, "", window.location.pathname + window.location.search);
      }
    }

    function init() {
      captureDiscordHash();
      const arc = getArchiveParam();
      const code = getSessionParam();
      if (arc) {
        currentArchive = arc.toUpperCase();
        showBracketView();
        fetchArchive();
      } else if (code) {
        currentSession = code.toUpperCase();
        showBracketView();
        fetchSession();
        pollTimer = setInterval(fetchSession, POLL_INTERVAL);
      } else {
        showGallery();
        loadGallery();
        loadArchives();
        galleryTimer = setInterval(loadGallery, GALLERY_POLL);
      }
    }

    function showGallery() {
      document.getElementById("gallery-view").style.display = "block";
      document.getElementById("bracket-view").style.display = "none";
      document.getElementById("statusBar").style.display = "none";
      document.getElementById("liveBadge").style.display = "none";
      document.getElementById("tournamentNameEl").style.display = "none";
      document.getElementById("headerSubtitle").textContent = "LIVE TOURNAMENTS";
      const badge = document.getElementById("liveBadge");
      badge.classList.remove("archived");
      badge.innerHTML = `<span class="live-dot"></span>LIVE`;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      closeWs();
      closeChat();
      chatIsAdmin = false;
      chatPodSet = new Set();
      document.body.classList.remove("chat-admin");
      currentSession = null;
      currentArchive = null;
      loadArchives();
      // Reset compact state
      if (document.body.classList.contains("compact")) {
        document.body.classList.remove("compact");
        const cb = document.getElementById("compactBtn");
        if (cb) { cb.classList.remove("active"); cb.textContent = "Compact"; }
      }
      // Update URL
      history.pushState({}, "", window.location.pathname);
    }

    function showBracketView() {
      document.getElementById("gallery-view").style.display = "none";
      document.getElementById("bracket-view").style.display = "block";
      document.getElementById("statusBar").style.display = "flex";
      renderChatIdentity();
      if (!currentArchive) connectWs(); // archives are frozen — no live socket
    }

    function openArchive(id) {
      if (galleryTimer) { clearInterval(galleryTimer); galleryTimer = null; }
      currentArchive = id;
      history.pushState({}, "", `?archive=${id}`);
      showBracketView();
      fetchArchive();
    }

    function goToCode() {
      const code = document.getElementById("codeInput").value.trim().toUpperCase();
      if (!code) return;
      currentSession = code;
      if (galleryTimer) { clearInterval(galleryTimer); galleryTimer = null; }
      history.pushState({}, "", `?session=${code}`);
      showBracketView();
      fetchSession();
      pollTimer = setInterval(fetchSession, POLL_INTERVAL);
    }

    function openSession(code) {
      if (galleryTimer) { clearInterval(galleryTimer); galleryTimer = null; }
      currentSession = code;
      history.pushState({}, "", `?session=${code}`);
      showBracketView();
      fetchSession();
      pollTimer = setInterval(fetchSession, POLL_INTERVAL);
    }

    // ─── Gallery ─────────────────────────────────────────────────────────────
    async function loadGallery() {
      try {
        const res = await fetch(`${WORKER_URL}/sessions/active`);
        const json = await res.json();
        const grid = document.getElementById("galleryGrid");
        if (!json.ok || !json.sessions || json.sessions.length === 0) {
          grid.innerHTML = `<div class="gallery-empty" style="grid-column:1/-1">No tournaments are live right now.</div>`;
          return;
        }
        grid.innerHTML = json.sessions.map(s => {
          const ago = timeAgo(s.updatedAt);
          const mode = s.mode === "double" ? "Double Elimination" : "Single Elimination";
          const size = s.size ? `${s.size} teams` : "";
          const meta = [mode, size].filter(Boolean).join(" · ");
          return `<div class="gallery-card" onclick="openSession('${s.code}')">
            <div class="gallery-card-name">${escHtml(s.name || s.code)}</div>
            <div class="gallery-card-meta">${escHtml(meta)}</div>
            ${s.host ? `<div class="gallery-card-host">Host: ${escHtml(s.host)}</div>` : ""}
            <div class="gallery-card-updated">Updated ${ago}</div>
            <div class="gallery-card-arrow">&#8594;</div>
          </div>`;
        }).join("");
      } catch {
        document.getElementById("galleryGrid").innerHTML =
          `<div class="gallery-empty" style="grid-column:1/-1">Could not reach server. Retrying...</div>`;
      }
    }

    // ─── Archive gallery (finished tournaments, frozen forever) ──────────────
    async function loadArchives() {
      const grid = document.getElementById("archiveGrid");
      if (!grid) return;
      try {
        const res = await fetch(`${WORKER_URL}/archives`);
        const json = await res.json();
        if (!json.ok || !json.archives || json.archives.length === 0) {
          grid.innerHTML = `<div class="gallery-empty" style="grid-column:1/-1">No archived tournaments yet.</div>`;
          return;
        }
        grid.innerHTML = json.archives.map(a => {
          const mode = a.mode === "double" ? "Double Elimination" : "Single Elimination";
          const size = a.size ? `${a.size} teams` : "";
          const meta = [mode, size].filter(Boolean).join(" · ");
          const when = a.finishedAt ? new Date(a.finishedAt).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
          return `<div class="gallery-card" onclick="openArchive('${escHtml(a.id)}')">
            <div class="gallery-card-name">${escHtml(a.name || a.id)}</div>
            <div class="gallery-card-meta">${escHtml(meta)}</div>
            ${a.champion ? `<div class="gallery-card-champion">&#127942; ${escHtml(a.champion)}</div>` : ""}
            ${a.host ? `<div class="gallery-card-host">Host: ${escHtml(a.host)}</div>` : ""}
            ${when ? `<div class="gallery-card-updated">Finished ${when}</div>` : ""}
            <div class="gallery-card-arrow">&#8594;</div>
          </div>`;
        }).join("");
      } catch {
        grid.innerHTML = `<div class="gallery-empty" style="grid-column:1/-1">Could not load the archive.</div>`;
      }
    }

    async function fetchArchive() {
      if (!currentArchive) return;
      try {
        const res = await fetch(`${WORKER_URL}/archive/${currentArchive}`);
        if (!res.ok) { showWaiting("Archive not found."); return; }
        const json = await res.json();
        if (!json.state) { showWaiting("Archive not found."); return; }
        applyState(json.state);
        const when = json.finishedAt ? new Date(json.finishedAt).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }) : null;
        lastUpdated = null; // stop the "Updated Xs ago" ticker — this bracket is frozen
        document.getElementById("statusText").textContent = when ? `Finished ${when} · read-only archive` : "Read-only archive";
      } catch {
        document.getElementById("statusText").textContent = "Could not reach server.";
      }
    }

    function timeAgo(ts) {
      if (!ts) return "recently";
      const secs = Math.round((Date.now() - ts) / 1000);
      if (secs < 60) return `${secs}s ago`;
      if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
      return `${Math.floor(secs / 3600)}h ago`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ─── Bracket fetch ────────────────────────────────────────────────────────
    // Render a serialized session state (shared by the HTTP fetch and the WS push).
    function applyState(stateStr) {
      let data;
      try { data = JSON.parse(stateStr); } catch { return; }
      const { pods, tournamentMode, tournamentSize, tournamentName, finalsBracket } = data;
      const label = currentSession || currentArchive || "";
      const nameEl = document.getElementById("tournamentNameEl");
      if (tournamentName) {
        nameEl.textContent = tournamentName;
        nameEl.style.display = "block";
        document.title = `${tournamentName} - Codebreakers ${currentArchive ? "Archive" : "Live"}`;
      } else {
        nameEl.style.display = "none";
        document.title = `${label} - Codebreakers ${currentArchive ? "Archive" : "Live"}`;
      }
      document.getElementById("headerSubtitle").textContent = label;
      document.getElementById("main").innerHTML =
        renderBracket(pods, tournamentMode || "single", tournamentSize || 16, { finalsBracket: !!finalsBracket });
      const badge = document.getElementById("liveBadge");
      badge.style.display = "inline-flex";
      if (currentArchive) {
        badge.classList.add("archived");
        badge.innerHTML = "ARCHIVED";
      } else {
        badge.classList.remove("archived");
        if (!badge.querySelector(".live-dot")) badge.innerHTML = `<span class="live-dot"></span>LIVE`;
        lastUpdated = new Date();
        updateTimestamp();
      }
      updateChatButtons(); // bracket re-render wipes the pod chat buttons
      // Draw connector lines after DOM settles
      requestAnimationFrame(() => measureConnectors(pods, tournamentMode || "single", tournamentSize || 16, { finalsBracket: !!finalsBracket }));
    }

    async function fetchSession() {
      if (!currentSession) return;
      try {
        const res = await fetch(`${WORKER_URL}/session/${currentSession}`);
        if (!res.ok) { showWaiting("Session not found."); return; }
        const json = await res.json();
        if (!json.ok || !json.state) { showWaiting("No bracket data yet."); return; }
        applyState(json.state);
      } catch {
        document.getElementById("statusText").textContent = "Could not reach server. Retrying...";
      }
    }

    // ─── Read-only live WebSocket (instant spectator updates) ─────────────────
    function connectWs() {
      closeWs();
      if (!currentSession) return;
      const code = currentSession;
      const tok = adminToken || discordToken;
      const wsUrl = `${WS_URL}/session/${code}/ws${tok ? `?token=${encodeURIComponent(tok)}` : ""}`;
      try { ws = new WebSocket(wsUrl); } catch { scheduleWsReconnect(); return; }
      ws.onopen = () => { requestChatAccess(); };
      ws.onmessage = (ev) => {
        let data;
        try { data = JSON.parse(ev.data); } catch { return; }
        if (data.t === "state" && typeof data.state === "string") { applyState(data.state); requestChatAccess(); }
        else if (data.t === "chat-access") onChatAccess(data);
        else if (data.t === "chat-history") onChatHistory(data);
        else if (data.t === "chat-msg") onChatMsg(data);
        else if (data.t === "chat-del") onChatDel(data);
        else if (data.t === "chat-denied") onChatDenied(data);
      };
      ws.onerror = () => { try { ws.close(); } catch {} };
      ws.onclose = () => { ws = null; scheduleWsReconnect(); };
    }
    function scheduleWsReconnect() {
      if (wsReconnect) clearTimeout(wsReconnect);
      wsReconnect = setTimeout(() => { if (currentSession) connectWs(); }, 2000);
    }
    function closeWs() {
      if (wsReconnect) { clearTimeout(wsReconnect); wsReconnect = null; }
      if (ws) { try { ws.onclose = null; ws.close(); } catch {} ws = null; }
    }

    // ─── Match chat ──────────────────────────────────────────────────────────
    // Private: the server only grants access to participants of a pod's teams
    // (matched by Discord username from the roster) and to admins/co-hosts.
    function wsSend(obj) {
      if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); } catch {} }
    }
    function requestChatAccess() {
      if (adminToken || discordToken) wsSend({ t: "chat-access" });
    }
    function onChatAccess(data) {
      chatIsAdmin = !!data.admin;
      chatPodSet = new Set(data.pods || []);
      document.body.classList.toggle("chat-admin", chatIsAdmin);
      updateChatButtons();
      renderChatIdentity();
      // Refresh the open chat (roster/bracket may have changed our access).
      if (chatOpenPod) {
        if (chatIsAdmin || chatPodSet.has(chatOpenPod)) wsSend({ t: "chat-open", podId: chatOpenPod });
        else closeChat();
      }
    }
    function podLabelById(podId) {
      const el = document.querySelector(`[data-pod-id="${podId}"] .pod-header`);
      return el ? el.textContent.trim() : "MATCH CHAT";
    }
    function updateChatButtons() {
      document.querySelectorAll(".pod-chat-btn").forEach((b) => b.remove());
      if (currentArchive) return; // archives are frozen — no chat
      document.querySelectorAll("#main [data-pod-id]").forEach((el) => {
        const podId = el.getAttribute("data-pod-id");
        if (!(chatIsAdmin || chatPodSet.has(podId))) return;
        const btn = document.createElement("button");
        btn.className = "pod-chat-btn";
        btn.innerHTML = "&#128172;";
        btn.title = "Open match chat";
        btn.onclick = (e) => { e.stopPropagation(); openChat(podId); };
        el.appendChild(btn);
      });
    }
    function openChat(podId) {
      chatOpenPod = podId;
      document.getElementById("chatTitle").textContent = podLabelById(podId);
      document.getElementById("chatMsgs").innerHTML = `<div class="chat-empty">Loading...</div>`;
      document.getElementById("chatDrawer").classList.add("open");
      wsSend({ t: "chat-open", podId });
    }
    function closeChat() {
      chatOpenPod = null;
      document.getElementById("chatDrawer").classList.remove("open");
    }
    function chatMsgHtml(m) {
      const time = new Date(m.ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      return `<div class="chat-msg${m.admin ? " admin" : ""}" data-msg-id="${escHtml(m.id)}">
        <div class="m-head"><span class="m-name">${escHtml(m.name)}${m.admin ? " ⚑" : ""}</span><span class="m-time">${time}</span></div>
        <div class="m-text">${escHtml(m.text)}</div>
        <button class="chat-del" title="Delete message" onclick="deleteChatMsg('${escHtml(m.id)}')">&#10005;</button>
      </div>`;
    }
    function onChatHistory(data) {
      if (data.podId !== chatOpenPod) return;
      const box = document.getElementById("chatMsgs");
      box.innerHTML = (data.messages && data.messages.length)
        ? data.messages.map(chatMsgHtml).join("")
        : `<div class="chat-empty">No messages yet. Say hi to your block!</div>`;
      box.scrollTop = box.scrollHeight;
    }
    function onChatMsg(data) {
      if (data.podId !== chatOpenPod) return;
      const box = document.getElementById("chatMsgs");
      const empty = box.querySelector(".chat-empty");
      if (empty) empty.remove();
      box.insertAdjacentHTML("beforeend", chatMsgHtml(data.msg));
      box.scrollTop = box.scrollHeight;
    }
    function onChatDel(data) {
      if (data.podId !== chatOpenPod) return;
      const el = document.querySelector(`#chatMsgs [data-msg-id="${CSS.escape(data.msgId)}"]`);
      if (el) el.remove();
    }
    function onChatDenied(data) {
      if (data.podId === chatOpenPod) {
        document.getElementById("chatMsgs").innerHTML = `<div class="chat-empty">You don't have access to this chat.</div>`;
      }
    }
    function sendChat() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || !chatOpenPod) return;
      wsSend({ t: "chat-send", podId: chatOpenPod, text });
      input.value = "";
    }
    function deleteChatMsg(msgId) {
      if (chatOpenPod) wsSend({ t: "chat-delete", podId: chatOpenPod, msgId });
    }
    // Decode our signed token's payload (display only — server re-verifies).
    function tokenPayload(tok) {
      try {
        let b = tok.split(".")[0].replace(/-/g, "+").replace(/_/g, "/");
        while (b.length % 4) b += "=";
        return JSON.parse(atob(b));
      } catch { return null; }
    }
    function renderChatIdentity() {
      const el = document.getElementById("chatIdentity");
      if (!el) return;
      if (currentArchive) { el.innerHTML = ""; return; }
      if (adminToken) {
        el.innerHTML = `<span class="chat-user-chip">${chatIsAdmin ? "ADMIN CHAT" : "ADMIN"}</span>`;
        return;
      }
      if (discordToken) {
        const p = tokenPayload(discordToken);
        const name = p && (p.name || p.uname) ? (p.name || p.uname) : "Discord user";
        el.innerHTML = `<span class="chat-user-chip">&#128172; ${escHtml(name)}
          <button class="chat-signout" onclick="discordSignOut()">sign out</button></span>`;
        return;
      }
      el.innerHTML = `<button class="discord-btn" onclick="discordSignIn()">Sign in with Discord</button>`;
    }
    function discordSignIn() {
      const ret = window.location.origin + window.location.pathname + window.location.search;
      window.location.href = `${WORKER_URL}/discord/login?return=${encodeURIComponent(ret)}`;
    }
    function discordSignOut() {
      localStorage.removeItem("cb_discord_token");
      discordToken = null;
      chatIsAdmin = false;
      chatPodSet = new Set();
      document.body.classList.remove("chat-admin");
      closeChat();
      updateChatButtons();
      renderChatIdentity();
      connectWs(); // reconnect without the token
    }

    function showWaiting(msg) {
      document.getElementById("liveBadge").style.display = "none";
      document.getElementById("main").innerHTML = `
        <div class="waiting-screen">
          <span class="waiting-pulse"></span>
          <span>${msg || "Tournament hasn't started yet. Check back soon."}</span>
        </div>`;
      document.getElementById("statusText").textContent = "Waiting for data...";
    }

    function updateTimestamp() {
      if (!lastUpdated) return;
      const secs = Math.round((Date.now() - lastUpdated.getTime()) / 1000);
      document.getElementById("statusText").textContent =
        `Updated ${secs === 0 ? "just now" : secs + "s ago"} · auto-refreshes every 5s`;
    }

    // ─── Phase graph (MUST match bracketEngine.ts exactly) ────────────────────
    function getPhaseGraph(size, mode) {
      if (mode !== "double") {
        if (size === 8)  return [
          { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"final" },
          { id:"final",label:"CASH-OUT FINAL",bracket:"wb",advanceTo:"gf" },
          { id:"gf",label:"GRAND FINAL",bracket:"gf" },
        ];
        if (size === 16) return [
          { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"semis" },
          { id:"semis",label:"SEMIFINALS",bracket:"wb",advanceTo:"final" },
          { id:"final",label:"CASH-OUT FINAL",bracket:"wb",advanceTo:"gf" },
          { id:"gf",label:"GRAND FINAL",bracket:"gf" },
        ];
        return [
          { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"quarters" },
          { id:"quarters",label:"QUARTERFINALS",bracket:"wb",advanceTo:"semis" },
          { id:"semis",label:"SEMIFINALS",bracket:"wb",advanceTo:"final" },
          { id:"final",label:"CASH-OUT FINAL",bracket:"wb",advanceTo:"gf" },
          { id:"gf",label:"GRAND FINAL",bracket:"gf" },
        ];
      }
      if (size === 8) return [
        { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"wb-final",dropTo:"lb-r1" },
        { id:"wb-final",label:"WB FINAL",bracket:"wb",advanceTo:"cashout",dropTo:"lb-final" },
        { id:"lb-r1",label:"LB ROUND 1",bracket:"lb",advanceTo:"lb-final" },
        { id:"lb-final",label:"LB FINAL",bracket:"lb",advanceTo:"cashout" },
        { id:"cashout",label:"CASH-OUT FINAL",bracket:"gf",advanceTo:"gf",hasNoLBDrop:true },
        { id:"gf",label:"GRAND FINAL",bracket:"gf" },
      ];
      if (size === 16) return [
        { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"wb-semis",dropTo:"lb-r1" },
        { id:"wb-semis",label:"WB SEMIFINALS",bracket:"wb",advanceTo:"wb-final",dropTo:"lb-r2" },
        { id:"wb-final",label:"WB FINAL",bracket:"wb",advanceTo:"cashout",dropTo:"lb-final" },
        { id:"lb-r1",label:"LB ROUND 1",bracket:"lb",advanceTo:"lb-r2" },
        { id:"lb-r2",label:"LB ROUND 2",bracket:"lb",advanceTo:"lb-semi" },
        { id:"lb-semi",label:"LB SEMIFINAL",bracket:"lb",advanceTo:"lb-final" },
        { id:"lb-final",label:"LB FINAL",bracket:"lb",advanceTo:"cashout" },
        { id:"cashout",label:"CASH-OUT FINAL",bracket:"gf",advanceTo:"gf",hasNoLBDrop:true },
        { id:"gf",label:"GRAND FINAL",bracket:"gf" },
      ];
      return [
        { id:"groups",label:"GROUP STAGE",bracket:"wb",advanceTo:"wb-r2",dropTo:"lb-r1" },
        { id:"wb-r2",label:"WB QUARTERS",bracket:"wb",advanceTo:"wb-semis",dropTo:"lb-r2" },
        { id:"wb-semis",label:"WB SEMIFINALS",bracket:"wb",advanceTo:"wb-final",dropTo:"lb-r4" },
        { id:"wb-final",label:"WB FINAL",bracket:"wb",advanceTo:"cashout",dropTo:"lb-final" },
        { id:"lb-r1",label:"LB ROUND 1",bracket:"lb",advanceTo:"lb-r2" },
        { id:"lb-r2",label:"LB ROUND 2",bracket:"lb",advanceTo:"lb-r3" },
        { id:"lb-r3",label:"LB ROUND 3",bracket:"lb",advanceTo:"lb-r4" },
        { id:"lb-r4",label:"LB ROUND 4",bracket:"lb",advanceTo:"lb-semi" },
        { id:"lb-semi",label:"LB SEMIFINAL",bracket:"lb",advanceTo:"lb-final" },
        { id:"lb-final",label:"LB FINAL",bracket:"lb",advanceTo:"cashout" },
        { id:"cashout",label:"CASH-OUT FINAL",bracket:"gf",advanceTo:"gf",hasNoLBDrop:true },
        { id:"gf",label:"GRAND FINAL",bracket:"gf" },
      ];
    }

    // Insert the head-to-head finals round before GF when enabled (matches engine).
    function applyFinalsBracket(graph, opts) {
      if (!opts || !opts.finalsBracket) return graph;
      const finalId = graph.find(p => p.id === "cashout") ? "cashout" : "final";
      const out = [];
      for (const p of graph) {
        if (p.id === finalId) out.push({ ...p, advanceTo: "fbracket" });
        else if (p.id === "gf") {
          out.push({ id:"fbracket", label:"FINALS", bracket:"gf", advanceTo:"gf" });
          out.push(p);
        } else out.push(p);
      }
      return out;
    }

    function groupPodsByPhase(pods, mode, size, opts) {
      const graph = applyFinalsBracket(getPhaseGraph(size, mode), opts);
      const labelMap = new Map(graph.map(p => [p.id, p.label]));
      const map = new Map();
      for (const p of pods) {
        if (!map.has(p.phase)) map.set(p.phase, []);
        map.get(p.phase).push(p);
      }
      return graph
        .filter(ph => map.has(ph.id))
        .map(ph => ({
          phase: ph.id,
          label: labelMap.get(ph.id) || ph.id.toUpperCase(),
          pods: map.get(ph.id),
          bracket: map.get(ph.id)[0]?.bracket,
        }));
    }

    // ─── Team row renderer ────────────────────────────────────────────────────
    function renderTeamRow(team, isGF, isDE, isLB, hasNoLBDrop, podSize) {
      const placement = team.placement || 0;
      const advanceCount = podSize / 2;
      const isChampion = isGF && placement === 1 && team.name;
      const isAdvancing = !isGF && placement >= 1 && placement <= advanceCount;
      const isDropping  = isDE && !isLB && !isGF && !hasNoLBDrop && placement > advanceCount && placement <= podSize;
      const isEliminated = !isGF && (
        (isLB && placement > advanceCount) ||
        (!isDE && placement > advanceCount) ||
        (isDE && hasNoLBDrop && placement > advanceCount)
      );
      const isEmpty = !team.name;
      let cls = "team-row";
      if (isChampion)   cls += " champion";
      else if (isAdvancing)  cls += " advancing";
      else if (isDropping)   cls += " dropping";
      else if (isEliminated) cls += " eliminated";
      const emoji = isChampion ? "&#9819;" : "";
      const placementLabel = placement !== 0 ? PLACEMENT_LABELS[placement] : "";
      let inner = "";
      if (!isGF) {
        inner += `<span class="team-seed-group">`;
        if (team.seed > 0) inner += `<span class="team-seed">#${team.seed}</span>`;
        inner += `</span>`;
      }
      if (isGF && isDE && team.path) {
        const badgeCls = team.path === "wb" ? "wb-badge" : "lb-badge";
        inner += `<span class="path-badge ${badgeCls}">[${team.path.toUpperCase()}]</span>`;
      }
      inner += `<span class="team-emoji">${emoji}</span>`;
      const hasRoster = Array.isArray(team.players) && team.players.length > 0;
      let nameHtml = `<span class="team-name${isEmpty ? " empty" : ""}${hasRoster ? " has-roster" : ""}">`;
      nameHtml += (team.name || "- TBD -");
      if (hasRoster) {
        nameHtml += `<span class="roster-tooltip"><span class="roster-tooltip-title">${escHtml(team.name)}</span>`;
        for (const p of team.players) nameHtml += `<span class="roster-tooltip-player">&#9658; ${escHtml(p)}</span>`;
        nameHtml += `</span>`;
      }
      nameHtml += `</span>`;
      inner += nameHtml;
      if (placementLabel) inner += `<span class="placement-badge${isChampion ? " champion-badge" : ""}">${placementLabel}</span>`;
      return `<div class="${cls}">${inner}</div>`;
    }

    // ─── Pod renderer ─────────────────────────────────────────────────────────
    function renderPod(pod, isGF, isDE, isLB) {
      const isLiveNow = !!pod.liveNow;
      const isOnStream = !!pod.onStream && !pod.liveNow;
      const podCls = ["match-pod", isGF ? "gf-pod" : "", isLB ? "lb-pod" : "", isLiveNow ? "live-now" : "", isOnStream ? "on-stream" : ""].filter(Boolean).join(" ");
      const headerCls = ["pod-header", isGF ? "gf-header" : "", isLB ? "lb-header" : ""].filter(Boolean).join(" ");
      const podSize = pod.teams.length;
      let html = `<div class="${podCls}" data-pod-id="${pod.id}">`;
      const streamBadge = isLiveNow
        ? ` <span class="stream-live-badge">&#9679; LIVE</span>`
        : isOnStream ? ` <span class="stream-live-badge" style="color:var(--cb-cyan)">&#9679;</span>` : "";
      html += `<div class="${headerCls}">${pod.label}${streamBadge}</div>`;
      if (pod.map) html += `<div class="map-plate"><span class="map-name">${escHtml(pod.map)}</span></div>`;
      for (const team of pod.teams) html += renderTeamRow(team, isGF, isDE, isLB, pod.hasNoLBDrop, podSize);
      html += `</div>`;
      return html;
    }

    // ─── Bracket renderer ─────────────────────────────────────────────────────
    function renderBracket(pods, mode, size, opts) {
      const phases = groupPodsByPhase(pods, mode, size, opts);
      const isDE = mode === "double";
      if (!isDE) {
        let html = `<div class="bracket-container"><div class="bracket-inner">`;
        phases.forEach((ph, i) => {
          if (i > 0) html += `<div class="connector-spacer"></div>`;
          html += `<div class="bracket-phase">`;
          html += `<div class="phase-label">${ph.label}</div>`;
          html += `<div class="pods-column">`;
          for (const pod of ph.pods) html += renderPod(pod, pod.phase === "gf", false, false);
          html += `</div></div>`;
        });
        html += `</div></div>`;
        return html;
      }
      const wbPhases = phases.filter(ph => ph.bracket === "wb");
      const lbPhases = phases.filter(ph => ph.bracket === "lb");
      const gfPhases = phases.filter(ph => ph.bracket === "gf");
      let html = `<div class="bracket-container"><div class="de-bracket-wrapper">`;
      html += `<div class="de-row wb-row"><div class="de-row-label wb-row-label">WINNERS BRACKET</div><div class="de-row-phases">`;
      wbPhases.forEach((ph, i) => {
        if (i > 0) html += `<div class="connector-spacer"></div>`;
        html += `<div class="bracket-phase"><div class="phase-label">${ph.label}</div><div class="pods-column">`;
        for (const pod of ph.pods) html += renderPod(pod, false, true, false);
        html += `</div></div>`;
      });
      html += `</div></div>`;
      html += `<div class="de-zone-divider"></div>`;
      html += `<div class="de-row lb-row"><div class="de-row-label lb-row-label">LOSERS BRACKET</div><div class="de-row-phases">`;
      lbPhases.forEach((ph, i) => {
        if (i > 0) html += `<div class="connector-spacer"></div>`;
        html += `<div class="bracket-phase"><div class="phase-label lb-phase-label">${ph.label}</div><div class="pods-column">`;
        for (const pod of ph.pods) html += renderPod(pod, false, true, true);
        html += `</div></div>`;
      });
      html += `</div></div>`;
      if (gfPhases.length > 0) {
        html += `<div class="de-gf-column">`;
        for (const ph of gfPhases) {
          html += `<div class="phase-label gf-phase-label" style="padding-bottom:12px">${ph.label}</div>`;
          html += `<div style="display:flex;flex-direction:column;gap:8px;align-items:center">`;
          for (const pod of ph.pods) html += renderPod(pod, pod.phase === "gf", true, false);
          html += `</div>`;
        }
        html += `</div>`;
      }
      html += `</div></div>`;
      return html;
    }

    // ─── Connector line system ─────────────────────────────────────────────
    let _lastConnectorArgs = null;
    function measureConnectors(pods, mode, size, opts) {
      _lastConnectorArgs = { pods, mode, size, opts };
      const container = document.querySelector(".bracket-container");
      if (!container) return;
      // Remove old SVG overlay
      const old = container.querySelector(".connector-svg-overlay");
      if (old) old.remove();
      const containerRect = container.getBoundingClientRect();
      const graph = applyFinalsBracket(getPhaseGraph(size, mode), opts);
      const phaseById = new Map(graph.map(p => [p.id, p]));
      const lines = [];
      for (const pod of pods) {
        const phase = phaseById.get(pod.phase);
        if (!phase) continue;
        const srcEl = container.querySelector(`[data-pod-id="${pod.id}"]`);
        if (!srcEl) continue;
        const srcRows = srcEl.querySelectorAll(".team-row");
        const podSize = pod.teams.length;
        const advanceCount = podSize / 2;
        // Advance connectors
        if (phase.advanceTo) {
          const advancingTeams = pod.teams
            .map((t, i) => ({ t, i }))
            .filter(({ t }) => t.placement >= 1 && t.placement <= advanceCount && t.name)
            .sort((a, b) => a.t.placement - b.t.placement);
          for (const { t, i: srcRowIdx } of advancingTeams) {
            const destPod = pods.find(p => p.phase === phase.advanceTo && p.teams.some(dt => dt.name === t.name));
            if (!destPod) continue;
            const dstEl = container.querySelector(`[data-pod-id="${destPod.id}"]`);
            if (!dstEl) continue;
            const dstRows = dstEl.querySelectorAll(".team-row");
            const dstRowIdx = destPod.teams.findIndex(dt => dt.name === t.name);
            const srcRow = srcRows[srcRowIdx];
            const dstRow = dstRows[dstRowIdx];
            if (!srcRow || !dstRow) continue;
            const s = srcRow.getBoundingClientRect();
            const d = dstRow.getBoundingClientRect();
            lines.push({ x1: s.right - containerRect.left, y1: s.top + s.height/2 - containerRect.top,
              x2: d.left - containerRect.left, x2R: d.right - containerRect.left, y2: d.top + d.height/2 - containerRect.top,
              key: `${pod.id}-adv-${t.name}`, active: true, isDrop: false, channelX: 0 });
          }
          // Ghost lines when no advances yet
          if (advancingTeams.length === 0) {
            const destPhasePods = pods.filter(p => p.phase === phase.advanceTo);
            for (let i = 0; i < Math.min(advanceCount, 2); i++) {
              const destPod = destPhasePods[Math.floor(i/2)] || destPhasePods[0];
              if (!destPod) continue;
              const dstEl = container.querySelector(`[data-pod-id="${destPod.id}"]`);
              if (!dstEl) continue;
              const srcRow = srcRows[i];
              const dstRows = dstEl.querySelectorAll(".team-row");
              const dstRow = dstRows[i % destPod.teams.length];
              if (!srcRow || !dstRow) continue;
              const s = srcRow.getBoundingClientRect();
              const d = dstRow.getBoundingClientRect();
              lines.push({ x1: s.right - containerRect.left, y1: s.top + s.height/2 - containerRect.top,
                x2: d.left - containerRect.left, x2R: d.right - containerRect.left, y2: d.top + d.height/2 - containerRect.top,
                key: `${pod.id}-ghost-${i}`, active: false, isDrop: false, channelX: 0 });
            }
          }
        }
        // Drop connectors (DE WB only)
        // Drop lines are intentionally NOT rendered on the spectator view:
        // across the compressed live layout they cross over pods (the "strikethrough"
        // look). Spectators only need the green advance lines for readability.
        if (false && phase.dropTo && mode === "double" && !phase.hasNoLBDrop) {
          const droppingTeams = pod.teams
            .map((t, i) => ({ t, i }))
            .filter(({ t }) => t.placement > advanceCount && t.placement <= podSize && t.name)
            .sort((a, b) => a.t.placement - b.t.placement);
          for (const { t, i: srcRowIdx } of droppingTeams) {
            const destPod = pods.find(p => p.phase === phase.dropTo && p.teams.some(dt => dt.name === t.name));
            if (!destPod) continue;
            const dstEl = container.querySelector(`[data-pod-id="${destPod.id}"]`);
            if (!dstEl) continue;
            const dstRows = dstEl.querySelectorAll(".team-row");
            const dstRowIdx = destPod.teams.findIndex(dt => dt.name === t.name);
            const srcRow = srcRows[srcRowIdx];
            const dstRow = dstRows[dstRowIdx];
            if (!srcRow || !dstRow) continue;
            const s = srcRow.getBoundingClientRect();
            const d = dstRow.getBoundingClientRect();
            lines.push({ x1: s.right - containerRect.left, y1: s.top + s.height/2 - containerRect.top,
              x2: d.left - containerRect.left, x2R: d.right - containerRect.left, y2: d.top + d.height/2 - containerRect.top,
              key: `${pod.id}-drop-${t.name}`, active: true, isDrop: true, channelX: 0 });
          }
          // Ghost drop lines
          if (droppingTeams.length === 0) {
            const dropCount = podSize / 2;
            const destPhasePods = pods.filter(p => p.phase === phase.dropTo);
            for (let i = 0; i < Math.min(dropCount, 2); i++) {
              const destPod = destPhasePods[Math.floor(i/2)] || destPhasePods[0];
              if (!destPod) continue;
              const dstEl = container.querySelector(`[data-pod-id="${destPod.id}"]`);
              if (!dstEl) continue;
              const srcRow = srcRows[advanceCount + i];
              const dstRows = dstEl.querySelectorAll(".team-row");
              const dstRow = dstRows[i % destPod.teams.length];
              if (!srcRow || !dstRow) continue;
              const s = srcRow.getBoundingClientRect();
              const d = dstRow.getBoundingClientRect();
              lines.push({ x1: s.right - containerRect.left, y1: s.top + s.height/2 - containerRect.top,
                x2: d.left - containerRect.left, x2R: d.right - containerRect.left, y2: d.top + d.height/2 - containerRect.top,
                key: `${pod.id}-ghostdrop-${i}`, active: false, isDrop: true, channelX: 0 });
            }
          }
        }
      }
      // Assign channelX corridors
      const bySource = new Map();
      for (const ln of lines) {
        const srcKey = ln.key.split("-")[0] + "-" + (ln.key.split("-")[1] || "");
        if (!bySource.has(srcKey)) bySource.set(srcKey, []);
        bySource.get(srcKey).push(ln);
      }
      for (const group of bySource.values()) {
        group.forEach((ln, gi) => {
          const gap = ln.x2 - ln.x1;
          if (gap < 12) {
            // Same-column / stacked (finals): corridor sits RIGHT of both pods and
            // the line ENTERS THE DEST FROM ITS RIGHT EDGE. Entering at the left
            // edge would drag the horizontal across the pod (strikethrough bug).
            ln.x2 = ln.x2R;
            ln.channelX = Math.max(ln.x1, ln.x2R) + 12 + gi * 5;
          } else {
            // Normal left-to-right: corridor must stay INSIDE the gutter
            // (live gutter is only 20px, so no fixed 24px minimum).
            const base = ln.x1 + Math.max(8, Math.min(gap * 0.4, gap - 8));
            ln.channelX = Math.min(base + gi * 5, ln.x2 - 6);
          }
        });
      }
      // Build SVG
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.classList.add("connector-svg-overlay");
      svg.setAttribute("style", "position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible");
      for (const c of lines) {
        const color = c.isDrop ? (c.active ? "#ff8a3d" : "#2b1c10") : (c.active ? "#28d17c" : "#20242f");
        const sw = c.active ? 2 : 1;
        const cx = Math.max(c.x1 + 8, c.channelX);
        const dirY = c.y2 >= c.y1 ? 1 : -1;
        const dirIn = c.x2 >= cx ? 1 : -1;
        const r = Math.max(0, Math.min(8, Math.abs(c.y2 - c.y1) / 2, Math.abs(cx - c.x1), Math.abs(c.x2 - cx)));
        const dPath = r > 1
          ? `M ${c.x1} ${c.y1} L ${cx-r} ${c.y1} Q ${cx} ${c.y1} ${cx} ${c.y1+dirY*r} L ${cx} ${c.y2-dirY*r} Q ${cx} ${c.y2} ${cx+dirIn*r} ${c.y2} L ${c.x2} ${c.y2}`
          : `M ${c.x1} ${c.y1} L ${cx} ${c.y1} L ${cx} ${c.y2} L ${c.x2} ${c.y2}`;
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", dPath);
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", sw);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("opacity", c.active ? "1" : "0.4");
        if (c.active) path.style.filter = c.isDrop ? "drop-shadow(0 0 3px rgba(255,138,61,0.4))" : "drop-shadow(0 0 3px rgba(40,209,124,0.4))";
        if (c.isDrop) path.setAttribute("stroke-dasharray", "4,5");
        svg.appendChild(path);
      }
      container.style.position = "relative";
      container.insertBefore(svg, container.firstChild);
    }
    window.addEventListener("resize", () => {
      if (_lastConnectorArgs) {
        const { pods, mode, size, opts } = _lastConnectorArgs;
        measureConnectors(pods, mode, size, opts);
      }
    });
    // ─── Compact toggle ───────────────────────────────────────────────────────
    function toggleCompact() {
      _compactActive = !_compactActive;
      document.body.classList.toggle("compact", _compactActive);
      const btn = document.getElementById("compactBtn");
      if (btn) {
        btn.classList.toggle("active", _compactActive);
        btn.textContent = _compactActive ? "Normal" : "Compact";
      }
    }

    // ─── Timestamp updater ────────────────────────────────────────────────────
    setInterval(updateTimestamp, 5000);

    // ─── Start ────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
