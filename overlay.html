<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codebreakers Stream Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* Terminal Violet broadcast tokens */
  :root {
    --panel: rgba(8,9,12,0.92);
    --line: #1e222d;
    --line2: #2b3142;
    --silver: #aab1c5;
    --purple: #7c5cff;
    --purple2: #a48fff;
    --cyan: #38e1e8;
    --text: #e6e9f2;
    --muted: #7f8698;
    --red: #ff4d5e;
    --fd: 'Space Grotesk', sans-serif;
    --fm: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Transparent background so OBS Browser Source overlays cleanly */
  html, body {
    background: transparent;
    font-family: var(--fd);
    color: var(--text);
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  #overlay-root {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .match-card {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--line2);
    box-shadow: inset 0 1px 0 rgba(124,92,255,0.25), 0 12px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    backdrop-filter: blur(4px);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    opacity: 0;
    transition: opacity 300ms ease;
  }
  .match-card.visible { opacity: 1; }

  /* Each team column */
  .team-col {
    flex: 1;
    min-width: 220px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  .team-col:not(:last-child) {
    border-right: 1px solid var(--line);
  }

  .team-head {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .team-seed {
    font-family: var(--fm);
    font-size: 11px;
    font-weight: 500;
    color: var(--purple2);
    letter-spacing: 0.08em;
    min-width: 28px;
  }
  .team-name {
    font-family: var(--fd);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .roster {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    padding-left: 2px;
  }
  .player {
    font-family: var(--fm);
    font-size: 11px;
    font-weight: 500;
    color: var(--silver);
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
  }

  /* Header strip: tournament name + match label */
  .match-header {
    position: absolute;
    top: -36px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .match-label {
    font-family: var(--fd);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .match-map {
    font-family: var(--fm);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* 4-team layout: 2x2 grid feel via wrapping */
  .match-card.teams-4 { max-width: 1100px; }
  .match-card.teams-2 { max-width: 720px; }

  #waiting {
    font-family: var(--fm);
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }
</style>
</head>
<body>
<div id="overlay-root">
  <div id="waiting">Waiting for a live match...</div>
</div>

<script>
  const WORKER_URL = "https://operator-api-rt.taksatovq.workers.dev";
  const POLL_MS = 2500;

  const params = new URLSearchParams(window.location.search);
  const sessionCode = (params.get("session") || "").toUpperCase();
  // Optional: hide players with ?players=0
  const showPlayers = params.get("players") !== "0";

  const root = document.getElementById("overlay-root");

  function escHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let lastSignature = "";

  function renderMatch(pod, tournamentName) {
    if (!pod) {
      // nothing live: show waiting, keep it subtle
      if (lastSignature !== "WAITING") {
        root.innerHTML = '<div id="waiting">Waiting for a live match...</div>';
        lastSignature = "WAITING";
      }
      return;
    }

    const teams = (pod.teams || []).filter(t => t && t.name);
    const count = teams.length;
    const signature = JSON.stringify({ id: pod.id, map: pod.map, teams: teams.map(t => [t.name, t.seed, (t.players||[]).join(",")]) });
    if (signature === lastSignature) return; // no change, skip re-render (avoids flicker)
    lastSignature = signature;

    const teamCols = teams.map(t => {
      const seed = t.seed ? `#${t.seed}` : "";
      const players = showPlayers && Array.isArray(t.players) && t.players.length
        ? `<div class="roster">${t.players.map(p => `<span class="player">${escHtml(p)}</span>`).join("")}</div>`
        : "";
      return `
        <div class="team-col">
          <div class="team-head">
            <span class="team-seed">${escHtml(seed)}</span>
            <span class="team-name">${escHtml(t.name)}</span>
          </div>
          ${players}
        </div>`;
    }).join("");

    const mapLabel = pod.map ? `<span class="match-map">${escHtml(pod.map)}</span>` : "";
    const header = `
      <div class="match-header">
        <span class="live-dot"></span>
        <span class="match-label">${escHtml(pod.label || "LIVE MATCH")}</span>
        ${mapLabel}
      </div>`;

    root.innerHTML = `
      <div class="match-card teams-${count >= 3 ? 4 : 2}" style="margin-top: 34px;">
        ${header}
        ${teamCols}
      </div>`;
    // fade in
    const card = root.querySelector(".match-card");
    requestAnimationFrame(() => card && card.classList.add("visible"));
  }

  async function poll() {
    if (!sessionCode) {
      root.innerHTML = '<div id="waiting">No session specified. Add ?session=CB-XXXX to the URL.</div>';
      return;
    }
    try {
      const res = await fetch(`${WORKER_URL}/session/${sessionCode}`);
      if (!res.ok) { renderMatch(null); return; }
      const json = await res.json();
      if (!json.ok || !json.state) { renderMatch(null); return; }
      const data = JSON.parse(json.state);
      const pods = data.pods || [];
      // The streamed match is the pod flagged liveNow
      const livePod = pods.find(p => p.liveNow);
      renderMatch(livePod, data.tournamentName);
    } catch (e) {
      // network hiccup: keep last render, don't flash
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
