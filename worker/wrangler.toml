name = "codebreakers-api"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Same KV namespace as before the rename (accounts, invites, archives, session index).
kv_namespaces = [
  { binding = "OPERATOR_KV", id = "c3ed0a2d65ab421eaaf09e15fcce7f83" }
]

# Durable Object that holds each live session's authoritative state.
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

# Discord OAuth application (chat login on live.html).
# DISCORD_CLIENT_SECRET is a secret: `npx wrangler secret put DISCORD_CLIENT_SECRET`
# NOTE: [vars] must stay last — top-level keys after it would be swallowed into the table.
[vars]
DISCORD_CLIENT_ID = "1529573475650371919"
# "CODE Tournament Registrations" database (Notion). Token: `npx wrangler secret put NOTION_TOKEN`
NOTION_DB_ID = "abeee4339fe3422ba8bc224974196f92"
